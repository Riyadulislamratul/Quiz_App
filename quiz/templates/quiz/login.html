{% extends 'quiz/base.html' %}

{% block title %}Login - Quiz Portal{% endblock %}

{% block content %}
<div class="glass-card form-container">
    <h1 class="form-title">Welcome Back</h1>
    <p class="form-subtitle">Log in to your participant account to take quizzes and see your ranking</p>
    
    <form method="POST" action="{% url 'quiz:login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label for="id_username" class="form-label">Username or Email</label>
            <input type="text" name="username" autofocus required id="id_username" class="form-input" placeholder="Enter username or email">
        </div>
        <div class="form-group">
            <label for="id_password" class="form-label">Password</label>
            <input type="password" name="password" required id="id_password" class="form-input" placeholder="Enter password">
        </div>
        
        <button type="submit" class="btn-primary" style="margin-top: 1rem;">Login</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem; color: var(--text-secondary);">
        Don't have an account? <a href="{% url 'quiz:register' %}" style="color: var(--accent); text-decoration: none; font-weight: 500;">Register here</a>
    </div>
</div>
{% endblock %}
